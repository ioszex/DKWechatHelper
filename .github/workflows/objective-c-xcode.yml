name: build deb

on: 
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Check cache
        run: |
          echo upstream_heads=`git ls-remote https://github.com/roothide/theos | head -n 1 | cut -f 1`-`git ls-remote https://github.com/theos/sdks | head -n 1 | cut -f 1` >> $GITHUB_ENV
      - name: Use cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: ${{ runner.os }}-${{ env.upstream_heads }}

      - name: Prepare Theos
        uses: iossxx/theos-action@main
        with:
          theos-dir: ${{ github.workspace }}/theos
          theos-src: 'https://github.com/roothide/theos'
          theos-sdks: 'https://github.com/theos/sdks'

      - name: Setup GNU Make
        run: |
          echo "$(brew --prefix)/opt/make/libexec/gnubin" >> $GITHUB_PATH

      - name: Fix postinst permissions
        run: |
          if [ -f layout/DEBIAN/postinst ]; then
            chmod 755 layout/DEBIAN/postinst
          fi

      - name: Build package
        env:
          THEOS: ${{ github.workspace }}/theos
          GITHUB_ACTIONS: "true"
        run: |
          mkdir -p packages
          rm -f packages/*.deb 2>/dev/null || true
          make package FINALPACKAGE=1 -j$(sysctl -n hw.ncpu)
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1 -j$(sysctl -n hw.ncpu)
          make package THEOS_PACKAGE_SCHEME=roothide FINALPACKAGE=1 -j$(sysctl -n hw.ncpu)
      - name: Upload specific Deb packages
        uses: actions/upload-artifact@v4
        with:
          name: DKWechatHelper
          path: ${{ github.workspace }}/packages/*.deb
